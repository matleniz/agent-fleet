name: CI

# Lint + test on every push to main and every PR. Nothing here is a runtime
# dependency of the tools: shellcheck/ruff run only in CI, and the test suite is
# the repo's own hand-rolled bash scripts (test/*.sh), which already exit non-zero
# on failure. Keeps the one real risk — bin/ ↔ docs drift and shell/py bugs — in
# check without adding anything the tools depend on.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning   # style/info are advisory only; warnings+ gate (see .shellcheckrc)

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin ruff itself (not just the action tag). Without `version`, ruff-action@v4
      # installs latest, which floated from 0.15.22 (last green on main, 2026-07-21)
      # to 0.16.9 and started failing on unchanged bin/ code via newly-default
      # rules (UP031, C401, SIM115, PLW1510, ISC004, I001, BLE001, …). Keep the
      # pin until a deliberate follow-up upgrades bin/ and bumps this together.
      - uses: astral-sh/ruff-action@v4.1.0   # self-installs ruff; reads ruff.toml (incl. bin/fleet-assess)
        with:
          version: "0.15.22"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux (needed by the dispatch/barrier E2E layers)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Git identity (make-sandbox commits a seed repo)
        run: |
          git config --global user.email ci@agent-fleet.invalid
          git config --global user.name  "agent-fleet CI"
      - name: Run the test suite
        run: |
          set -euo pipefail
          for t in test/docs-sync.sh test/gate.sh test/test-context.sh test/test-guard.sh \
                   test/test-chats-scan.sh test/test-feedback-pipeline.sh \
                   test/global.sh test/test-mcp-profile.sh \
                   test/dispatch.sh test/relaunch.sh \
                   test/test-name-validation.sh test/test-new-worker.sh \
                   test/test-legacy-isolation.sh test/test-claude-resume.sh \
                   test/test-orphan-windows.sh test/test-stale-done-windows.sh \
                   test/test-worker-stall.sh test/test-worker-lifecycle-health.sh \
                   test/test-coordinator-wakeup.sh \
                   test/test-supervision-watchdog.sh test/test-supervision-group.sh \
                   test/test-server-detect.sh \
                   test/test-antigravity-doctor.sh test/test-copilot-doctor.sh \
                   test/test-resolve-conf.sh test/test-tty-guard.sh \
                   test/barrier-guard.sh test/barrier-cursor.sh \
                   test/test-route-table.sh test/test-route-scorer.sh \
                   test/test-route-e2e.sh \
                   test/test-gate-checks.sh test/test-dispatch-spec-e2e.sh test/test-gate-spec-group-e2e.sh \
                   test/test-claude-headless-model.sh test/test-pack-model.sh test/test-judge-e2e.sh test/test-race-e2e.sh test/test-fanin-e2e.sh test/test-pipeline-e2e.sh \
                   test/test-attach-chooser.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
          for p in antigravity copilot; do
            echo "::group::barrier-mount-ns $p"
            bash test/barrier-mount-ns.sh "$p"
            echo "::endgroup::"
          done
